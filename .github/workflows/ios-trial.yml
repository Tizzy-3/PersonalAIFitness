name: Build Personal Fitness trial

on:
  push:
    branches: [main, develop, codex/fitness-coach-20261030]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-fitness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trial:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      PF_OUTPUT: ${{ github.workspace }}/output
      PF_DERIVED: ${{ github.workspace }}/build/DerivedData
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify fixed toolchain and project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PF_OUTPUT"
          xcodebuild -version | tee "$PF_OUTPUT/toolchain.log"
          xcodebuild -version | head -n 1 | grep -E '^Xcode 27\.0$'
          xcrun --sdk iphoneos --show-sdk-version | tee -a "$PF_OUTPUT/toolchain.log"
          python3 scripts/generate_project.py
          plutil -lint PersonalFitness.xcodeproj/project.pbxproj Sources/PersonalFitness/Resources/Info.plist Sources/PersonalFitness/Resources/PersonalFitness.entitlements
          python3 scripts/check_source.py | tee "$PF_OUTPUT/static-checks.log"
          python3 scripts/sync_expanded_catalog.py | tee "$PF_OUTPUT/catalog-checks.log"
          python3 scripts/import_free_exercise_catalog.py | tee -a "$PF_OUTPUT/catalog-checks.log"
          python3 scripts/check_media.py | tee "$PF_OUTPUT/media-checks.log"

      - name: Run independent core tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/FitnessCore 2>&1 | tee "$PF_OUTPUT/core-tests.log"

      - name: Test native persistence and backup on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(python3 scripts/select_simulator.py --boot)
          echo "Simulator ID: $device_id" | tee "$PF_OUTPUT/simulator.log"
          xcodebuild test \
            -project PersonalFitness.xcodeproj -scheme PersonalFitness \
            -configuration Debug -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$PF_DERIVED" -resultBundlePath "$PF_OUTPUT/NativeTests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM="" \
            2>&1 | tee "$PF_OUTPUT/native-tests.log"

      - name: Verify historical compiled stores across process boundaries
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(python3 scripts/select_simulator.py --boot)
          python3 -u scripts/test_historical_stores.py --device "$device_id" 2>&1 | tee "$PF_OUTPUT/upgrade-store.log"

      - name: Capture actual native screens without sample user data
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(python3 scripts/select_simulator.py --boot)
          xcrun simctl install "$device_id" "$PF_DERIVED/Build/Products/Debug-iphonesimulator/PersonalFitness.app"
          for tab in 0 1 2 3 4; do
            xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
            xcrun simctl launch "$device_id" com.personalfitness.private --capture-tab "$tab"
            sleep 3
            xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-tab-$tab.png"
          done
          xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
          xcrun simctl launch "$device_id" com.personalfitness.private --capture-planner
          sleep 3
          xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-planner.png"
          xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
          xcrun simctl launch "$device_id" com.personalfitness.private --capture-settings
          sleep 3
          xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-settings.png"
          xcrun simctl ui "$device_id" appearance dark
          xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
          xcrun simctl launch "$device_id" com.personalfitness.private --capture-tab 0
          sleep 3
          xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-today-dark.png"
          xcrun simctl ui "$device_id" appearance light
          xcrun simctl ui "$device_id" content_size accessibility-extra-extra-extra-large
          xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
          xcrun simctl launch "$device_id" com.personalfitness.private --capture-tab 2
          sleep 3
          xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-library-large.png"
          xcrun simctl ui "$device_id" content_size large
          xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
          xcrun simctl launch "$device_id" com.personalfitness.private --capture-workout
          sleep 3
          xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-workout-validation.png"
          xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
          xcrun simctl launch "$device_id" com.personalfitness.private --capture-interview
          sleep 3
          xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-interview.png"
          xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
          xcrun simctl launch "$device_id" com.personalfitness.private --capture-history
          sleep 3
          xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-history-validation.png"
          xcrun simctl ui "$device_id" appearance dark
          xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
          xcrun simctl launch "$device_id" com.personalfitness.private --capture-history
          sleep 3
          xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-history-dark.png"
          xcrun simctl ui "$device_id" appearance light
          xcrun simctl ui "$device_id" content_size accessibility-extra-extra-extra-large
          xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
          xcrun simctl launch "$device_id" com.personalfitness.private --capture-history
          sleep 3
          xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-history-large.png"
          xcrun simctl ui "$device_id" content_size large

          for variant in male female; do
            xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
            if [ "$variant" = female ]; then
              xcrun simctl launch "$device_id" com.personalfitness.private --capture-media --capture-media-female
            else
              xcrun simctl launch "$device_id" com.personalfitness.private --capture-media
            fi
            sleep 3
            xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-media-$variant.png"
          done

          for scenario in interview review readback draft deferred deferred-readback gentle-readback; do
            xcrun simctl terminate "$device_id" com.personalfitness.private >/dev/null 2>&1 || true
            xcrun simctl launch "$device_id" com.personalfitness.private "--capture-constraint-$scenario"
            sleep 3
            xcrun simctl io "$device_id" screenshot "$PF_OUTPUT/native-constraint-$scenario.png"
          done

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project PersonalFitness.xcodeproj -scheme PersonalFitness \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$PF_DERIVED" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$PF_OUTPUT/iphone-build.log"

      - name: Package successful unsigned build
        shell: bash
        run: |
          set -euo pipefail
          app="$PF_DERIVED/Build/Products/Release-iphoneos/PersonalFitness.app"
          test -d "$app"
          staging="$RUNNER_TEMP/PersonalFitnessTrial"
          mkdir -p "$staging/Payload"
          ditto "$app" "$staging/Payload/PersonalFitness.app"
          (cd "$staging" && /usr/bin/zip -qry "$PF_OUTPUT/PersonalFitness-unsigned.ipa" Payload)
          shasum -a 256 "$PF_OUTPUT/PersonalFitness-unsigned.ipa" > "$PF_OUTPUT/SHA256.txt"
          printf '%s\n' \
            'Personal Fitness 0.10.0 Warm paper visual system with a terracotta signal colour, a coach that speaks in a bubble, streak and weekly progress on Today, a rest countdown ring, and haptics on every completed set.' \
            "Source commit: $GITHUB_SHA" \
            "Workflow run: $GITHUB_RUN_ID / $GITHUB_RUN_ATTEMPT" \
            'Minimum iOS: 27.0. Unsigned IPA: sign before installation.' \
            'Default bundle ID: com.personalfitness.private; use a matching profile and preserve com.apple.developer.healthkit.' \
            'No seeded personal plans, workouts or health data.' \
            'Blue/white native UI, image-based movement library, structured coaching, accessible set-entry layout. Permanent legacy deletion requires a reviewed file list and explicit in-app confirmation; current dedicated training store is protected.' \
            'Screenshot workout/history scenarios are DEBUG-only, use isolated in-memory stores, are visibly marked validation-only, and never seed normal app data.' \
            'Includes: calendar training history; expanded offline movement catalog with explicit media attribution; free-form introductions and keyed in-depth interview follow-ups included in personalized planning; JSON-mode transport and bounded format repair; protected confirmed facts and explicit plan confirmation; daily feedback, health increments and deterministic reviews.' \
            'Not implemented: automatic progressive/cycle proposal generation, personal physiological baselines, general clinical adaptation beyond confirmed limited constraints, history correction, teaching videos for every movement. The separate trends tab was intentionally replaced by history.' \
            'CI and Simulator success do not prove device signing or HealthKit access.' \
            > "$PF_OUTPUT/BUILD-INFO.txt"
          { echo '### Personal Fitness 0.10.0'; echo 'Historical compiled-schema probes, Core and iOS Simulator tests completed before packaging.'; echo 'Download **PersonalFitness-unsigned-ipa** and sign it yourself.'; echo 'Actual on-device erasure, signing, AI-provider connection and HealthKit access remain unverified.'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PersonalFitness-unsigned-ipa
          path: |
            output/PersonalFitness-unsigned.ipa
            output/SHA256.txt
            output/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PersonalFitness-build-diagnostics
          path: |
            output/*.log
            output/native-*.png
            output/NativeTests.xcresult
          if-no-files-found: warn
          retention-days: 7
